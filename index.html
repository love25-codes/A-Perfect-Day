<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Perfect Day — An Interactive Story</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Ambient grain overlay -->
<div class="grain"></div>

<!-- ============ SCROLL CONTAINER (defines total scroll length) ============ -->
<div class="scroll-container" id="scrollContainer">

  <!-- ============ STICKY VIEWPORT (what's actually visible) ============ -->
  <div class="sticky-viewport">

    <!-- intro title, fades out early -->
    <div class="intro-title" id="introTitle">
      <span class="intro-eyebrow">an interactive story</span>
      <h1>A Perfect Day</h1>
      <span class="intro-hint">scroll to begin</span>
    </div>

    <!-- Ambient backlight glow behind everything -->
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- ===== WIRES (Phase 1) ===== -->
    <div class="wires-layer" id="wiresLayer">
      <svg class="wires-svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
        <path id="wireLeft" class="wire wire-left" d="M 250 -20 C 250 150, 350 250, 470 300" />
        <path id="wireRight" class="wire wire-right" d="M 750 -20 C 750 150, 650 250, 530 300" />
        <circle id="plugLeft" class="plug" cx="470" cy="300" r="9" />
        <circle id="plugRight" class="plug" cx="530" cy="300" r="9" />
      </svg>
      <div class="spark" id="spark">
        <svg viewBox="0 0 100 100">
          <polygon points="55,2 30,55 48,55 40,98 75,42 55,42" />
        </svg>
      </div>
    </div>

    <!-- ===== TV RIG (scales in during Phase 2) ===== -->
    <div class="tv-rig" id="tvRig">

      <div class="tv-chassis" id="tvChassis">

        <!-- speaker grill -->
        <div class="tv-grill">
          <div class="grill-slats"></div>
          <div class="tv-brand">MODEL&nbsp;7 · CHRONOVISION</div>
        </div>

        <!-- screen bezel + glass -->
        <div class="tv-screen-bezel">
          <div class="tv-screen" id="tvScreen">

            <div class="crt-static" id="crtStatic"></div>
            <div class="crt-bzzt" id="crtBzzt">BZZZT&hellip;</div>

            <!-- ===== 8 SCENES live here ===== -->
            <div class="scenes" id="scenes">

              <!-- Scene 1 — 07:00 AM Wake Up -->
              <section class="scene scene-1" data-scene="0">
                <div class="sky sky-dawn"></div>
                <div class="sun-rays"></div>
                <div class="dust-motes" id="dustMotes"></div>
                <div class="curtain curtain-left"></div>
                <div class="curtain curtain-right"></div>
                <div class="window-frame"></div>
                <div class="bed">
                  <div class="pillow"></div>
                  <div class="blanket"></div>
                  <div class="sleeper" id="sleeper"></div>
                </div>
                <div class="clock-widget">
                  <span id="clockDigits">06:59</span>
                </div>
                <div class="scene-caption">
                  <span class="cap-time">07:00 AM</span>
                  <span class="cap-title">Wake Up</span>
                </div>
              </section>

              <!-- Scene 2 — 09:00 AM Morning -->
              <section class="scene scene-2" data-scene="1">
                <div class="sky sky-morning"></div>
                <div class="clouds" id="cloudsLayer"></div>
                <div class="birds" id="birdsLayer"></div>
                <div class="window-frame window-frame-2"></div>
                <div class="stretch-figure">
                  <div class="fig-torso"></div>
                  <div class="fig-arm fig-arm-left"></div>
                  <div class="fig-arm fig-arm-right"></div>
                  <div class="fig-head"></div>
                </div>
                <div class="scene-caption">
                  <span class="cap-time">09:00 AM</span>
                  <span class="cap-title">Morning</span>
                </div>
              </section>

              <!-- Scene 3 — 12:00 PM Cafe -->
              <section class="scene scene-3" data-scene="2">
                <div class="sky sky-cafe"></div>
                <div class="cafe-wall"></div>
                <div class="cafe-table">
                  <div class="mug">
                    <div class="mug-handle"></div>
                    <div class="steam s1"></div>
                    <div class="steam s2"></div>
                    <div class="steam s3"></div>
                  </div>
                  <div class="plate"><div class="croissant"></div></div>
                </div>
                <div class="cafe-lamp"><div class="lamp-glow"></div></div>
                <div class="scene-caption">
                  <span class="cap-time">12:00 PM</span>
                  <span class="cap-title">Lunch</span>
                </div>
              </section>

              <!-- Scene 4 — 03:00 PM Adventure -->
              <section class="scene scene-4" data-scene="3">
                <div class="sky sky-afternoon"></div>
                <div class="city-skyline"></div>
                <div class="park-hill"></div>
                <div class="tree" style="left:12%;"></div>
                <div class="tree" style="left:78%;"></div>
                <div class="kite" id="kite">
                  <svg viewBox="0 0 60 70"><polygon points="30,0 60,30 30,70 0,30" /></svg>
                  <div class="kite-tail"></div>
                </div>
                <div class="runner">
                  <div class="runner-torso"></div>
                  <div class="runner-leg runner-leg-back"></div>
                  <div class="runner-leg runner-leg-front"></div>
                  <div class="runner-head"></div>
                </div>
                <div class="scene-caption">
                  <span class="cap-time">03:00 PM</span>
                  <span class="cap-title">Adventure</span>
                </div>
              </section>

              <!-- Scene 5 — 06:30 PM Golden Hour -->
              <section class="scene scene-5" data-scene="4">
                <div class="sky sky-golden"></div>
                <div class="sun-disc"></div>
                <div class="rooftop-silhouette"></div>
                <div class="antenna"></div>
                <div class="scene-caption">
                  <span class="cap-time">06:30 PM</span>
                  <span class="cap-title">Golden Hour</span>
                </div>
              </section>

              <!-- Scene 6 — 09:00 PM Evening -->
              <section class="scene scene-6" data-scene="5">
                <div class="sky sky-evening"></div>
                <div class="lamp-post"><div class="lamp-post-glow"></div></div>
                <div class="record-player">
                  <div class="vinyl" id="vinyl"><div class="vinyl-label"></div></div>
                  <div class="tonearm"></div>
                </div>
                <div class="notes" id="notesLayer"></div>
                <div class="scene-caption">
                  <span class="cap-time">09:00 PM</span>
                  <span class="cap-title">Evening</span>
                </div>
              </section>

              <!-- Scene 7 — 11:30 PM Night -->
              <section class="scene scene-7" data-scene="6">
                <div class="sky sky-night"></div>
                <div class="stars" id="starsLayer"></div>
                <div class="moon"><div class="moon-glow"></div></div>
                <div class="window-frame window-frame-3"></div>
                <div class="sleeping-figure"></div>
                <div class="scene-caption">
                  <span class="cap-time">11:30 PM</span>
                  <span class="cap-title">Night</span>
                </div>
              </section>

              <!-- Scene 8 — Ending Credits -->
              <section class="scene scene-8" data-scene="7">
                <div class="credits-bg"></div>
                <div class="credits-roll">
                  <p class="credits-heading">A Perfect Day</p>
                  <p class="credits-line">STARRING</p>
                  <p class="credits-name">YOU</p>
                  <p class="credits-line">DIRECTED&nbsp;BY</p>
                  <p class="credits-name">YOU</p>
                  <p class="credits-line">WRITTEN&nbsp;BY</p>
                  <p class="credits-name">LIFE</p>
                  <p class="credits-line credits-thanks">thank you for watching</p>
                </div>
                <button class="watch-again" id="watchAgainBtn">&#8635; WATCH AGAIN</button>
              </section>

            </div><!-- /.scenes -->

            <div class="crt-scanlines"></div>
            <div class="crt-vignette"></div>
            <div class="crt-glass-glare"></div>
          </div><!-- /.tv-screen -->
        </div><!-- /.tv-screen-bezel -->

        <!-- control panel -->
        <div class="tv-controls">
          <div class="knob" id="knobChannel"><div class="knob-notch"></div></div>
          <div class="knob knob-small" id="knobVolume"><div class="knob-notch"></div></div>
          <div class="led" id="tvLed"></div>
        </div>

      </div><!-- /.tv-chassis -->

      <div class="tv-legs"><span></span><span></span></div>
    </div><!-- /.tv-rig -->

    <!-- ===== FILM-REEL TIMELINE ===== -->
    <nav class="timeline" id="timeline" aria-label="Story timeline">
      <div class="timeline-track">
        <div class="timeline-fill" id="timelineFill"></div>
      </div>
      <ol class="timeline-list" id="timelineList">
        <li data-index="0"><button><span class="tl-sprocket"></span><span class="tl-label">07:00<em>Wake Up</em></span></button></li>
        <li data-index="1"><button><span class="tl-sprocket"></span><span class="tl-label">09:00<em>Morning</em></span></button></li>
        <li data-index="2"><button><span class="tl-sprocket"></span><span class="tl-label">12:00<em>Lunch</em></span></button></li>
        <li data-index="3"><button><span class="tl-sprocket"></span><span class="tl-label">15:00<em>Adventure</em></span></button></li>
        <li data-index="4"><button><span class="tl-sprocket"></span><span class="tl-label">18:30<em>Golden Hour</em></span></button></li>
        <li data-index="5"><button><span class="tl-sprocket"></span><span class="tl-label">21:00<em>Evening</em></span></button></li>
        <li data-index="6"><button><span class="tl-sprocket"></span><span class="tl-label">23:30<em>Night</em></span></button></li>
        <li data-index="7"><button><span class="tl-sprocket"></span><span class="tl-label">&#8734;<em>Credits</em></span></button></li>
      </ol>
    </nav>

  </div><!-- /.sticky-viewport -->
</div><!-- /.scroll-container -->

<script src="script.js"></script>
</body>
</html>
